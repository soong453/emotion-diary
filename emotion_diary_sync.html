<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>30 天情绪日记本</title>
  <style>
    :root{
      --bg:#f3eee7;
      --paper:#fffdf9;
      --ink:#1d1a17;
      --muted:#6d665d;
      --line:#e6dccd;
      --shadow:0 18px 50px rgba(58,46,34,.11);
      --mint:#dff2e7;
      --sky:#e4f0ff;
      --peach:#ffe8dd;
      --butter:#fff4be;
      --rose:#ffe1eb;
      --lilac:#efe7ff;
      --radius:16px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(circle at 10% 10%, rgba(255,232,221,.7), transparent 24%),
        radial-gradient(circle at 86% 10%, rgba(228,240,255,.85), transparent 26%),
        linear-gradient(180deg,#f8f3ed 0%, #f2ede5 100%);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
      letter-spacing:0;
    }
    a{color:inherit}
    .wrap{max-width:1360px;margin:0 auto;padding:18px 14px 36px}
    .hero,.bar,.panel,.card,.page,.sync-box{
      background:rgba(255,253,249,.78);
      backdrop-filter:blur(10px);
      border:1px solid rgba(0,0,0,.06);
      box-shadow:var(--shadow);
    }
    .hero{
      border-radius:22px;
      padding:18px;
      display:grid;
      grid-template-columns:1.35fr .95fr;
      gap:16px;
      align-items:end;
    }
    .eyebrow{font-size:12px;font-weight:800;color:var(--muted);display:flex;gap:8px;align-items:center}
    .dot{width:10px;height:10px;border-radius:999px;background:#fff4be;box-shadow:14px 0 0 #e4f0ff,28px 0 0 #dff2e7}
    h1{margin:10px 0 10px;font-size:42px;line-height:1.05;font-weight:950}
    .lead{margin:0;max-width:58ch;color:var(--muted);font-size:16px;line-height:1.75}
    .cover{
      min-height:186px;border-radius:20px;padding:16px;position:relative;overflow:hidden;
      background:
        linear-gradient(160deg, rgba(255,255,255,.92), rgba(255,255,255,.72)),
        repeating-linear-gradient(90deg, rgba(0,0,0,.03) 0 1px, transparent 1px 28px),
        repeating-linear-gradient(180deg, rgba(0,0,0,.03) 0 1px, transparent 1px 28px);
    }
    .cover:before,.cover:after{content:"";position:absolute;border-radius:999px;opacity:.85}
    .cover:before{width:108px;height:108px;right:18px;top:18px;background:radial-gradient(circle at 35% 35%, #fff 0 12px, #f2ba90 13px 43px, transparent 44px)}
    .cover:after{width:146px;height:82px;left:18px;bottom:18px;background:linear-gradient(135deg, rgba(223,242,231,.95), rgba(228,240,255,.92));clip-path:polygon(0 25%, 18% 0, 100% 0, 100% 100%, 0 100%)}
    .cover-card{
      position:absolute;left:16px;right:16px;bottom:16px;z-index:1;
      background:rgba(255,253,249,.92);border:1px solid rgba(0,0,0,.06);border-radius:16px;padding:14px;
    }
    .cover-card strong{display:block;font-size:18px;line-height:1.35;margin-bottom:6px}
    .cover-card span{display:block;color:var(--muted);font-size:13px;line-height:1.65}
    .bar{
      margin-top:14px;border-radius:18px;padding:14px 16px;
      display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;
    }
    .actions{display:flex;flex-wrap:wrap;gap:8px}
    .btn{
      appearance:none;border:1px solid rgba(0,0,0,.08);background:#fff;color:var(--ink);
      height:38px;padding:0 14px;border-radius:999px;font:inherit;font-size:14px;font-weight:800;cursor:pointer;
    }
    .btn.primary{background:#171717;color:#fff;border-color:#171717}
    .btn.soft{background:linear-gradient(180deg,#fff,#fbf7f1)}
    .btn:hover,.daychip:hover,.emotion:hover{transform:translateY(-1px)}
    .status{color:var(--muted);font-size:13px;line-height:1.5;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .status strong{color:var(--ink);font-size:14px}
    .layout{margin-top:14px;display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}
    .panel{border-radius:20px;overflow:hidden}
    .head{padding:16px 18px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.3))}
    .head h2{margin:0 0 6px;font-size:20px;line-height:1.25;font-weight:900}
    .head p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}
    .days{padding:14px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
    .daychip,.emotion{
      border:1px solid rgba(0,0,0,.08);background:linear-gradient(180deg,#fff,#fcf8f2);border-radius:14px;cursor:pointer;font:inherit;text-align:left
    }
    .daychip{min-height:52px;padding:10px 8px;display:flex;flex-direction:column;justify-content:center;gap:2px}
    .daychip .small{font-size:11px;color:var(--muted);font-weight:700}
    .daychip .big{font-size:14px;font-weight:900}
    .daychip.active{background:#171717;color:#fff;border-color:#171717}
    .daychip.active .small{color:rgba(255,255,255,.72)}
    .pages{display:grid;gap:14px;padding:14px}
    .page{
      position:relative;overflow:hidden;border-radius:18px;background:var(--paper);border:1px solid var(--line);
      padding:16px;box-shadow:0 10px 25px rgba(68,54,39,.05)
    }
    .page:before{
      content:"";position:absolute;inset:0;pointer-events:none;opacity:.24;
      background:
        linear-gradient(180deg, transparent 0 36px, rgba(0,0,0,.03) 36px 37px, transparent 37px),
        repeating-linear-gradient(180deg, rgba(0,0,0,.025) 0 1px, transparent 1px 28px);
    }
    .page-inner{position:relative;z-index:1;display:grid;gap:14px}
    .page-top{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
    .tag{display:inline-flex;align-items:center;justify-content:center;min-width:74px;height:34px;padding:0 12px;border-radius:999px;background:#171717;color:#fff;font-size:13px;font-weight:900}
    .page h3{margin:0;font-size:24px;line-height:1.25;font-weight:950}
    .sub{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.65}
    .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}
    .block{border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px}
    .block.mint{background:linear-gradient(180deg, rgba(223,242,231,.62), rgba(255,255,255,.95))}
    .block.sky{background:linear-gradient(180deg, rgba(228,240,255,.56), rgba(255,255,255,.95))}
    .block.peach{background:linear-gradient(180deg, rgba(255,232,221,.58), rgba(255,255,255,.95))}
    .block.rose{background:linear-gradient(180deg, rgba(255,225,235,.68), rgba(255,255,255,.95))}
    .block.butter{background:linear-gradient(180deg, rgba(255,244,190,.68), rgba(255,255,255,.95))}
    .label{display:block;margin-bottom:8px;font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase}
    textarea{
      width:100%;border:0;outline:0;resize:vertical;background:transparent;color:var(--ink);
      font:inherit;font-size:15px;line-height:1.7;min-height:92px
    }
    textarea::placeholder{color:#9a8f83}
    .short{min-height:56px}
    .mini{display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr}
    .mini .panelx{padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}
    .panelx strong{display:block;margin-bottom:6px;font-size:12px;color:var(--muted);text-transform:uppercase}
    .checks{display:grid;gap:8px}
    .check{display:flex;gap:10px;align-items:flex-start;padding:10px 10px 10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.8)}
    .check input{width:18px;height:18px;margin-top:2px;accent-color:#171717}
    .check span{font-size:14px;line-height:1.55}
    .sidebar{display:grid;gap:14px;position:sticky;top:14px}
    .emotion-grid{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .emotion{
      min-height:104px;padding:12px;border-radius:16px;display:grid;gap:8px;align-content:start
    }
    .emotion .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
    .swatch{width:14px;height:14px;border-radius:999px;flex:0 0 auto;box-shadow:0 0 0 4px rgba(0,0,0,.03)}
    .emotion strong{font-size:15px;line-height:1.25}
    .emotion small{display:block;color:var(--muted);font-size:12px;line-height:1.55}
    .emotion.active{border-color:#171717;box-shadow:0 10px 22px rgba(24,20,17,.12);transform:translateY(-1px)}
    .mood{padding:16px}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:#171717;color:#fff;font-size:13px;font-weight:900;margin-bottom:10px}
    .mood p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
    .current{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:8px}
    .current strong{font-size:18px;line-height:1.25}
    .current span{color:var(--muted);font-size:13px;line-height:1.6}
    .sync-box{border-radius:20px;padding:14px}
    .sync-box h3{margin:0 0 8px;font-size:18px;line-height:1.25;font-weight:900}
    .sync-box p{margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.65}
    .sync-row{display:grid;gap:10px}
    .sync-row textarea{min-height:110px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px}
    .file{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .file input{max-width:100%}
    .tip{padding:12px;border-radius:14px;border:1px dashed var(--line-strong);background:rgba(255,255,255,.65);color:var(--muted);font-size:13px;line-height:1.7}
    .float{position:fixed;right:16px;bottom:16px;z-index:20;padding:12px 14px;border-radius:999px;background:#171717;color:#fff;text-decoration:none;font-size:13px;font-weight:900;box-shadow:0 16px 30px rgba(23,23,23,.22)}
    @media (max-width:1080px){.layout{grid-template-columns:1fr}.sidebar{position:static}}
    @media (max-width:860px){.hero,.bar,.grid,.mini{grid-template-columns:1fr}.days{grid-template-columns:repeat(4,minmax(0,1fr))}h1{font-size:34px}.page h3{font-size:22px}}
    @media (max-width:560px){.wrap{padding:12px 10px 24px}.days{grid-template-columns:repeat(3,minmax(0,1fr));padding:12px}.emotion-grid{grid-template-columns:1fr}.page{padding:12px}.page-top{grid-template-columns:1fr}.btn{height:36px;padding:0 12px}.bar,.hero{padding:12px}}
  </style>
</head>
<body id="top">
  <main class="wrap">
    <section class="hero">
      <div>
        <div class="eyebrow"><span class="dot"></span><span id="eyebrow"></span></div>
        <h1 id="title"></h1>
        <p class="lead" id="lead"></p>
      </div>
      <div class="cover">
        <div class="cover-card">
          <strong id="coverTitle"></strong>
          <span id="coverDesc"></span>
        </div>
      </div>
    </section>

    <section class="bar">
      <div class="actions">
        <button class="btn primary" id="prevBtn" type="button"></button>
        <button class="btn primary" id="nextBtn" type="button"></button>
        <button class="btn soft" id="todayBtn" type="button"></button>
        <button class="btn soft" id="copySyncBtn" type="button"></button>
        <button class="btn soft" id="loadSyncBtn" type="button"></button>
        <button class="btn soft" id="exportBtn" type="button"></button>
        <button class="btn soft" id="importBtn" type="button"></button>
      </div>
      <div class="status">
        <span id="statusLeft"></span><strong id="statusDay"></strong><span id="statusRight"></span>
      </div>
    </section>

    <section class="layout">
      <section class="panel">
        <div class="head">
          <h2 id="pagesTitle"></h2>
          <p id="pagesDesc"></p>
        </div>
        <div class="days" id="dayNav"></div>
        <div class="pages" id="pages"></div>
      </section>

      <aside class="sidebar">
        <section class="panel">
          <div class="head">
            <h2 id="emotionTitle"></h2>
            <p id="emotionDesc"></p>
          </div>
          <div class="emotion-grid" id="emotionGrid"></div>
        </section>

        <section class="panel mood">
          <div class="pill" id="moodPill"></div>
          <p id="moodText"></p>
          <div class="current">
            <strong id="currentTitle"></strong>
            <span id="currentHint"></span>
          </div>
        </section>

        <section class="sync-box">
          <h3 id="syncTitle"></h3>
          <p id="syncDesc"></p>
          <div class="sync-row">
            <textarea id="syncCode" spellcheck="false" placeholder=""></textarea>
            <div class="file">
              <input id="fileInput" type="file" accept="application/json">
            </div>
            <div class="tip" id="syncTip"></div>
          </div>
        </section>
      </aside>
    </section>
  </main>

  <a class="float" href="#top" id="backTop"></a>

  <script>
    const T = {
      appTitle: "\u0033\u0030\u0020\u5929\u60c5\u7eea\u65e5\u8bb0\u672c",
      eyebrow: "\u53ef\u4ee5\u7f13\u7f13\u5199\uff0c\u4e5f\u53ef\u4ee5\u5199\u5f88\u591a",
      title: "\u628a\u5fc3\u60c5\u5199\u8f7b\u4e00\u70b9",
      lead: "\u8fd9\u662f\u4e00\u4e2a\u53ef\u4ee5\u5728\u7f51\u9875\u91cc\u8bb0\u5f55\u7684 30 \u5929\u60c5\u7eea\u65e5\u8bb0\u672c\u3002\u4f60\u53ef\u4ee5\u5148\u9009\u4e00\u5f20\u53ef\u7231\u7684\u60c5\u7eea\u5361\u7247\uff0c\u518d\u8fdb\u5165\u5f53\u5929\u9875\u9762\uff0c\u628a\u611f\u53d7\u3001\u8eab\u4f53\u53cd\u5e94\u3001\u60f3\u6cd5\u548c\u4e00\u4e2a\u5c0f\u5c0f\u7684\u660e\u5929\u8ba1\u5212\u6162\u6162\u5199\u4e0b\u6765\u3002",
      coverTitle: "\u4eca\u5929\u9002\u5408\u5199\u4e00\u70b9\u70b9\uff0c\u4e5f\u53ef\u4ee5\u5199\u5f88\u591a\u3002",
      coverDesc: "\u5de6\u8fb9\u662f 30 \u5929\u9875\u9762\uff0c\u53f3\u8fb9\u662f\u60c5\u7eea\u5361\u7247\u548c\u540c\u6b65\u4fdd\u5b58\u3002\u5982\u679c\u4f60\u6362\u8bbe\u5907\uff0c\u53ef\u4ee5\u76f4\u63a5\u7528\u5bfc\u51fa\u7684\u540c\u6b65\u7801\u6216 JSON \u5907\u4efd\u7ee7\u7eed\u8bb0\u3002",

      import: "\u5bfc\u5165\u5907\u4efd",
      statusLeft: "\u5f53\u524d\u9875",

      pagesDesc: "\u6bcf\u4e00\u9875\u90fd\u7559\u4e86\u7a7a\u767d\u3002\u4f60\u53ef\u4ee5\u53ea\u5199\u4e00\u53e5\uff0c\u4e5f\u53ef\u4ee5\u628a\u8fd9\u4e00\u5929\u7684\u6765\u9f99\u53bb\u8109\u90fd\u6490\u5f00\u6765\u5199\u3002",

    const DAYS = [

      ["\u5fc3\u91cc\u6709\u98ce","\u54ea\u4e00\u4ef6\u5c0f\u4e8b\u8ba9\u4f60\u7a81\u7136\u76b1\u4e86\u4e00\u4e0b\u7709\uff1f","rose"],
      ["\u67d4\u8f6f\u89c2\u5bdf","\u5982\u679c\u628a\u4eca\u5929\u62cd\u6210\u4e00\u5f20\u7167\u7247\uff0c\u4f60\u4f1a\u62cd\u4ec0\u4e48\uff1f","lilac"],
      ["\u91cd\u65b0\u547c\u5438","\u4eca\u5929\u6709\u6ca1\u6709\u4e00\u53e3\u6c14\uff0c\u7ec8\u4e8e\u653e\u677e\u4e0b\u6765\uff1f","mint"],
      ["\u5c0f\u5c0f\u56de\u6696","\u662f\u4ec0\u4e48\u8ba9\u4f60\u6062\u590d\u4e86\u4e00\u70b9\u70b9\u529b\u6c14\uff1f","peach"],
      ["\u4eca\u5929\u4e5f\u7b97\u6570","\u54ea\u4e9b\u52aa\u529b\u6ca1\u6709\u88ab\u522b\u4eba\u770b\u5230\uff0c\u4f46\u4f60\u81ea\u5df1\u77e5\u9053\uff1f","sky"],
      ["\u4e0d\u5fc5\u5b8c\u7f8e","\u4eca\u5929\u54ea\u4ef6\u4e8b\u4f60\u5df2\u7ecf\u5c3d\u529b\u4e86\uff1f","butter"],

    const state = {

    function safe(fn){ try { return fn(); } catch (e) { return null; } }

      return accent === "mint" ? "rgba(223,242,231,.95)" :
        accent === "sky" ? "rgba(228,240,255,.95)" :
        accent === "butter" ? "rgba(255,244,190,.95)" :
        accent === "rose" ? "rgba(255,225,235,.95)" :
        accent === "lilac" ? "rgba(239,231,255,.95)" : "rgba(255,232,221,.95)";
    }

    function setMood(index){
      state.mood = index;
      save("mood", String(index));
      document.querySelectorAll(".emotion").forEach((n) => n.classList.toggle("active", Number(n.dataset.index) === index));
      els.moodPill.textContent = T.moodPrefix + MOODS[index][0];
      els.moodText.textContent = MOODS[index][1];
    }

    function setDay(day){
      state.day = Math.min(Math.max(day, 1), DAYS.length);
      save("day", String(state.day));
      els.statusDay.textContent = "\u7b2c " + String(state.day).padStart(2, "0") + " \u5929";
      els.currentTitle.textContent = "\u7b2c " + String(state.day).padStart(2, "0") + " \u5929 \u00b7 " + DAYS[state.day - 1][0];
      els.currentHint.textContent = T.currentHintPrefix + DAYS[state.day - 1][1];
      document.querySelectorAll(".daychip").forEach((n) => n.classList.toggle("active", Number(n.dataset.day) === state.day));
    }

    function focusDay(day){
      setDay(day);
      const el = document.getElementById("day-" + state.day);
      if (el) el.scrollIntoView({behavior:"smooth", block:"start"});
    }

    function encodeState(){
      const data = {
        day: state.day,
        mood: state.mood,
        values: {}
      };
      document.querySelectorAll("[data-save]").forEach((node) => {
        const keyName = node.dataset.save;
        data.values[keyName] = node.type === "checkbox" ? node.checked : node.value;
      });
      return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    }

    function applyState(data){
      if (!data || typeof data !== "object") return;
      if (Number.isInteger(data.day)) state.day = data.day;
      if (Number.isInteger(data.mood)) state.mood = data.mood;
      if (data.values && typeof data.values === "object") {
        document.querySelectorAll("[data-save]").forEach((node) => {
          const v = data.values[node.dataset.save];
          if (typeof v === "undefined") return;
          if (node.type === "checkbox") node.checked = !!v;
          else node.value = String(v);
          save(node.dataset.save, node.type === "checkbox" ? (node.checked ? "1" : "0") : node.value);
        });
      }
      save("day", String(state.day));
      save("mood", String(state.mood));
      setMood(state.mood);
      setDay(state.day);
    }

    function loadAll(){
      document.querySelectorAll("[data-save]").forEach((node) => {
        const v = load(node.dataset.save, "");
        if (node.type === "checkbox") {
          node.checked = v === "1";
          node.addEventListener("change", () => save(node.dataset.save, node.checked ? "1" : "0"));
        } else {
          node.value = v;
          node.addEventListener("input", () => save(node.dataset.save, node.value));
        }
      });
      const day = Number(load("day", "1"));
      const mood = Number(load("mood", "0"));
      setMood(Number.isFinite(mood) && mood >= 0 && mood < MOODS.length ? mood : 0);
      setDay(Number.isFinite(day) && day >= 1 && day <= DAYS.length ? day : 1);
    }

    function bind(){
      els.prevBtn.addEventListener("click", () => focusDay(state.day - 1));
      els.nextBtn.addEventListener("click", () => focusDay(state.day + 1));
      els.todayBtn.addEventListener("click", () => focusDay(1));
      els.copySyncBtn.addEventListener("click", async () => {
        const code = encodeState();
        els.syncCode.value = code;
        try { await navigator.clipboard.writeText(code); } catch (e) {}
      });
      els.loadSyncBtn.addEventListener("click", () => {
        const text = els.syncCode.value.trim();
        if (!text) return;
        try {
          const json = decodeURIComponent(escape(atob(text)));
          applyState(JSON.parse(json));
        } catch (e) {
          alert("\u540c\u6b65\u7801\u4e0d\u80fd\u89e3\u6790\u3002");
        }
      });
      els.exportBtn.addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(JSON.parse(decodeURIComponent(escape(atob(encodeState())))), null, 2)], {type:"application/json;charset=utf-8"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "emotion-diary-backup.json";
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 500);
      });
      els.importBtn.addEventListener("click", () => els.fileInput.click());
      els.fileInput.addEventListener("change", async () => {
        const file = els.fileInput.files && els.fileInput.files[0];
        if (!file) return;
        const text = await file.text();
        try { applyState(JSON.parse(text)); } catch (e) { alert("\u5907\u4efd\u6587\u4ef6\u65e0\u6cd5\u8bfb\u53d6\u3002"); }
      });
      window.addEventListener("scroll", () => {
        const pages = [...document.querySelectorAll(".page")];
        let best = null;
        for (const el of pages) {
          const r = el.getBoundingClientRect();
          const score = Math.max(0, Math.min(window.innerHeight, r.bottom) - Math.max(0, r.top));
          if (!best || score > best.score) best = {el, score};
        }
        if (best) {
          const day = Number(best.el.dataset.day || "1");
          if (day !== state.day) setDay(day);
        }
      }, {passive:true});
    }

    els = {
      eyebrow: document.getElementById("eyebrow"),
      title: document.getElementById("title"),
      lead: document.getElementById("lead"),
      coverTitle: document.getElementById("coverTitle"),
      coverDesc: document.getElementById("coverDesc"),
      prevBtn: document.getElementById("prevBtn"),
      nextBtn: document.getElementById("nextBtn"),
      todayBtn: document.getElementById("todayBtn"),
      copySyncBtn: document.getElementById("copySyncBtn"),
      loadSyncBtn: document.getElementById("loadSyncBtn"),
      exportBtn: document.getElementById("exportBtn"),
      importBtn: document.getElementById("importBtn"),
      statusLeft: document.getElementById("statusLeft"),
      statusDay: document.getElementById("statusDay"),
      statusRight: document.getElementById("statusRight"),
      pagesTitle: document.getElementById("pagesTitle"),
      pagesDesc: document.getElementById("pagesDesc"),
      emotionTitle: document.getElementById("emotionTitle"),
      emotionDesc: document.getElementById("emotionDesc"),
      moodPill: document.getElementById("moodPill"),
      moodText: document.getElementById("moodText"),
      currentTitle: document.getElementById("currentTitle"),
      currentHint: document.getElementById("currentHint"),
      syncTitle: document.getElementById("syncTitle"),
      syncDesc: document.getElementById("syncDesc"),
      syncCode: document.getElementById("syncCode"),
      fileInput: document.getElementById("fileInput"),
      syncTip: document.getElementById("syncTip"),
      backTop: document.getElementById("backTop"),
      dayNav: document.getElementById("dayNav"),
      pages: document.getElementById("pages"),
      emotionGrid: document.getElementById("emotionGrid")
    };

    build();
    bind();
    loadAll();
    setMood(state.mood);
    setDay(state.day);
  </script>
</body>
</html>
