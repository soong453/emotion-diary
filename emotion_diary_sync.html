<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>30 天情绪日记本</title>
  <style>
    :root{--bg:#f3eee6;--paper:#fffdf8;--ink:#24201c;--muted:#7b7066;--line:#e5dacb;--shadow:0 28px 80px rgba(54,42,30,.16)}
    *{box-sizing:border-box}
    body{margin:0;color:var(--ink);background:radial-gradient(circle at 18% 12%,rgba(255,231,218,.9),transparent 24%),radial-gradient(circle at 82% 10%,rgba(221,239,255,.9),transparent 25%),linear-gradient(180deg,#f8f4ed 0%,#eee6dc 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:0;min-height:100vh}
    button,input,textarea,select{font:inherit;letter-spacing:0}
    .app{max-width:1180px;margin:0 auto;padding:18px 14px 32px}
    .top{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 4px 16px}
    .brand h1{margin:0;font-size:24px;line-height:1.15;font-weight:950}.brand p{margin:5px 0 0;color:var(--muted);font-size:13px;line-height:1.6}
    .tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .btn,.select{height:38px;border-radius:999px;border:1px solid rgba(0,0,0,.1);background:#fff;color:var(--ink);padding:0 14px;font-weight:800;font-size:14px;box-shadow:0 8px 20px rgba(54,42,30,.06)}
    .btn{cursor:pointer}.btn.dark{background:#1f1b18;color:#fff;border-color:#1f1b18}
    .book-wrap{perspective:1800px}.book{min-height:690px;display:grid;grid-template-columns:1fr 1fr;border-radius:20px;overflow:hidden;background:#d8cbb9;box-shadow:var(--shadow);position:relative}
    .book:before{content:"";position:absolute;top:0;bottom:0;left:50%;width:28px;z-index:4;transform:translateX(-50%);background:linear-gradient(90deg,rgba(0,0,0,.14),rgba(255,255,255,.55),rgba(0,0,0,.09));opacity:.45;pointer-events:none}
    .page{min-height:690px;background:linear-gradient(90deg,rgba(0,0,0,.04),transparent 10%,transparent 90%,rgba(0,0,0,.035)),var(--paper);padding:30px;position:relative;overflow:hidden}
    .page.left{border-right:1px solid rgba(0,0,0,.08)}.page.right{border-left:1px solid rgba(255,255,255,.7)}
    .page-no{position:absolute;top:16px;right:20px;color:#a09284;font-size:12px;font-weight:800}.left .page-no{left:20px;right:auto}
    .emotion-picture{height:100%;min-height:620px;border-radius:16px;display:grid;place-items:center;padding:28px;position:relative;overflow:hidden;background:var(--mood);box-shadow:inset 0 0 0 1px rgba(0,0,0,.07)}
    .emotion-picture:before{content:"";position:absolute;inset:26px;border-radius:14px;border:1px solid rgba(255,255,255,.62)}.emotion-picture:after{content:"";position:absolute;width:220px;height:220px;right:-80px;top:-70px;background:rgba(255,255,255,.35);border-radius:50%}
    .poster{width:min(420px,100%);aspect-ratio:3/4;border-radius:18px;background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.7);display:grid;grid-template-rows:auto 1fr auto;padding:22px;position:relative;z-index:1;box-shadow:0 18px 55px rgba(36,32,28,.14)}
    .poster-top{display:flex;justify-content:space-between;align-items:center;color:rgba(36,32,28,.72);font-size:13px;font-weight:900}.swatch{width:30px;height:30px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 7px rgba(255,255,255,.4)}
    .face{align-self:center;justify-self:center;width:210px;height:210px;border-radius:45% 45% 48% 48%;background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.62));position:relative;box-shadow:0 18px 35px rgba(54,42,30,.1)}
    .face:before,.face:after{content:"";position:absolute;top:82px;width:16px;height:16px;border-radius:50%;background:#2a2521;z-index:2}.face:before{left:64px}.face:after{right:64px}
    .mouth{position:absolute;left:50%;top:118px;width:62px;height:28px;transform:translateX(-50%);border-bottom:5px solid #28231f;border-radius:0 0 70px 70px}.cheek{position:absolute;top:112px;width:28px;height:14px;border-radius:999px;background:rgba(255,139,139,.35)}.cheek.l{left:34px}.cheek.r{right:34px}
    .spark{display:none}
    .emotion-name{margin:0;text-align:center;font-size:44px;line-height:1.05;font-weight:950}.emotion-desc{margin:10px auto 0;max-width:18em;text-align:center;color:rgba(36,32,28,.72);font-size:15px;line-height:1.7}
    .form-head{padding:8px 4px 14px;border-bottom:1px solid var(--line)}.form-head .day{font-size:13px;font-weight:900;color:var(--muted)}.form-head h2{margin:8px 0 6px;font-size:28px;line-height:1.18;font-weight:950}.form-head p{margin:0;color:var(--muted);font-size:14px;line-height:1.65}
    .fields{display:grid;gap:12px;margin-top:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{border:1px solid var(--line);background:rgba(255,255,255,.62);border-radius:12px;padding:12px}
    .field label,.check-title{display:block;margin-bottom:8px;color:var(--muted);font-size:12px;font-weight:900}textarea{width:100%;min-height:78px;resize:vertical;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px;line-height:1.7}textarea.big{min-height:120px}textarea::placeholder{color:#a39587}
    .checks{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.58);padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}.check{display:flex;gap:8px;align-items:flex-start;color:#433b34;font-size:14px;line-height:1.45}.check input{width:17px;height:17px;margin-top:2px;accent-color:#1f1b18;flex:0 0 auto}
    .bottom{margin-top:14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;color:var(--muted);font-size:13px}.progress{height:8px;border-radius:999px;background:rgba(0,0,0,.07);overflow:hidden}.progress span{display:block;height:100%;width:var(--progress);background:#1f1b18;border-radius:999px}
    .sync,.chooser{margin-top:14px;display:none;border:1px solid rgba(0,0,0,.08);border-radius:16px;background:rgba(255,253,248,.82);padding:14px;box-shadow:0 12px 32px rgba(54,42,30,.08)}.sync.open,.chooser.open{display:grid;gap:10px}.sync p,.chooser p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}.sync textarea{min-height:92px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px;font-size:13px}.sync-actions{display:flex;gap:8px;flex-wrap:wrap}
    .emotion-picture{cursor:pointer}.emotion-picture .poster{transition:transform .18s ease}.emotion-picture:hover .poster{transform:translateY(-2px)}
    .mood-options{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.mood-option{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;text-align:left;cursor:pointer;min-height:72px}.mood-option strong{display:block;font-size:14px;line-height:1.25}.mood-option span{display:block;margin-top:5px;color:var(--muted);font-size:12px;line-height:1.35}.mood-option:before{content:"";display:block;width:18px;height:18px;border-radius:50%;background:var(--c);margin-bottom:8px}
    .mobile-turn{display:none;margin-bottom:10px;grid-template-columns:1fr 1fr;gap:8px}.mobile-turn .btn{width:100%}
    @media (max-width:900px){.top{align-items:flex-start;flex-direction:column}.tools{justify-content:flex-start}.mobile-turn{display:grid}.book{grid-template-columns:1fr;min-height:0;transform-style:preserve-3d}.book:before{display:none}.page,.emotion-picture{min-height:auto}.emotion-picture{min-height:520px}.page.left{border-right:0;border-bottom:0}.page.right{border-left:0}.book.show-card .page.right{display:none}.book.show-write .page.left{display:none}.book.turning{animation:mobilePageTurn .34s ease both}@keyframes mobilePageTurn{0%{transform:rotateY(-8deg);opacity:.82}100%{transform:rotateY(0);opacity:1}}}
    @media (max-width:560px){.app{padding:12px 10px 24px}.page{padding:18px}.poster{padding:18px}.face{width:170px;height:170px}.face:before,.face:after{top:68px}.face:before{left:50px}.face:after{right:50px}.mouth{top:98px}.emotion-name{font-size:36px}.grid,.checks,.bottom{grid-template-columns:1fr}.mood-options{grid-template-columns:1fr 1fr}.btn,.select{height:36px;padding:0 12px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand"><h1>30 天情绪日记本</h1><p>像翻开一本真实的小本子：左页看见情绪，右页慢慢记录。</p></div>
      <div class="tools"><button class="btn dark" id="prevBtn" type="button">上一天</button><select class="select" id="daySelect" aria-label="选择天数"></select><button class="btn dark" id="nextBtn" type="button">下一天</button><button class="btn" id="chooseMood" type="button">选择情绪</button><button class="btn" id="syncToggle" type="button">同步/备份</button></div>
    </header>
    <section class="chooser" id="moodChooser"><p>手动选择今天的情绪卡片。想交给一点点运气，也可以直接点击左页大卡片随机换一张。</p><div class="mood-options" id="moodOptions"></div></section>
    <div class="mobile-turn"><button class="btn dark" id="showCard" type="button">翻到卡片</button><button class="btn dark" id="showWrite" type="button">翻到记录</button></div>
    <section class="book-wrap"><div class="book show-card" id="book">
      <section class="page left"><span class="page-no" id="leftPageNo"></span><div class="emotion-picture" id="emotionPicture"><article class="poster"><div class="poster-top"><span id="posterDay"></span><span class="swatch" id="swatch"></span></div><div class="face" id="face"><span class="mouth"></span><span class="cheek l"></span><span class="cheek r"></span><span class="spark one"></span><span class="spark two"></span><span class="spark three"></span></div><div><h2 class="emotion-name" id="emotionName"></h2><p class="emotion-desc" id="emotionDesc"></p></div></article></div></section>
      <section class="page right"><span class="page-no" id="rightPageNo"></span><div class="form-head"><div class="day" id="formDay"></div><h2 id="formTitle"></h2><p id="formPrompt"></p></div><div class="fields" id="fields"></div><div class="bottom"><div class="progress" aria-label="进度"><span id="progressBar"></span></div><span id="saveState">已自动保存</span></div></section>
    </div></section>
    <section class="sync" id="syncPanel"><p>换手机或换电脑时，先在旧设备点“生成同步码”，复制到新设备后点“读取同步码”。也可以导出 JSON 文件备份。</p><textarea id="syncCode" placeholder="同步码会出现在这里，也可以把同步码粘贴到这里。"></textarea><div class="sync-actions"><button class="btn dark" id="makeCode" type="button">生成同步码</button><button class="btn" id="readCode" type="button">读取同步码</button><button class="btn" id="exportJson" type="button">导出 JSON</button><button class="btn" id="importJson" type="button">导入 JSON</button><input id="fileInput" type="file" accept="application/json" hidden></div></section>
  </main>
  <script>
    const days=[
      ["轻轻开始","软乎乎","像刚晒过太阳的被子，想把自己安放好。","#ffdfe8","#f06f8f","今天最容易被忽略的小感受是什么？"],["慢慢安顿","平静","风停了一下，心也跟着慢下来。","#e4f0ff","#6ba6ff","有哪些事让你觉得世界稍微稳了一点？"],["有点忙，但还好","疲惫","电量偏低，想把动作都放慢。","#e8f7d9","#72b36a","今天最耗电的时刻出现在哪儿？"],["心里有风","烦躁","像桌面上的小东西突然都挤在一起。","#ffe8dd","#f28c68","哪一件小事让你突然皱了一下眉？"],["柔软观察","好奇","脑袋探出一点点，想看看前面是什么。","#efe7ff","#9b7be8","如果把今天拍成一张照片，你会拍什么？"],["重新呼吸","释然","终于不再拧巴，呼吸顺了些。","#dff2e7","#5aa879","今天有没有一口气终于放松下来？"],
      ["小小回暖","期待","还没发生，但心里已经开始亮了。","#fff4be","#e5b739","是什么让你恢复了一点点力气？"],["今天也算数","骄傲","有一件事，你真的做到了。","#ffe5b8","#d98a2b","哪些努力没有被别人看到，但你自己知道？"],["不必完美","松一口气","事情没那么可怕时，身体会先知道。","#dff2e7","#3d9c75","今天哪件事你已经尽力了？"],["安静过半","安稳","不是很激动，但很适合待着。","#e4f0ff","#5a95d8","今天的安静，是舒服的，还是空的？"],["心里亮了一下","开心泡泡","轻轻往上冒的快乐，通常很简单。","#fff4be","#f0bd2d","是什么让你忍不住笑了一秒？"],["慢一点也行","想躺平","不是放弃，是想先休息一下。","#efe7ff","#8b78cf","如果今天少做一件事，你最想少做什么？"],
      ["被照顾的瞬间","感动","被某句话或某个细节轻轻碰到。","#ffe1eb","#e66f98","今天有没有哪个瞬间像被轻轻接住？"],["一点点乱","焦虑","脑子跑得比身体快，停不下来。","#fff0cd","#d4a536","乱的是事情，还是心？"],["给自己留路","温柔","适合轻声说话，也轻声对待自己。","#ffe8dd","#e89373","明天你想给自己留出哪一小段余地？"],["有点想躲","害羞","脸颊先热起来，话还在后面。","#ffdfe8","#ef7897","今天你最想避开的是什么？"],["重新整理","满足","事情不一定大，但刚好对上了。","#fff4be","#ddb439","如果把今天分成三块，你会怎么分？"],["轻柔坚定","被看见","有人注意到了你真实的样子。","#e4f0ff","#5d9ce3","今天你做成了哪一件需要勇气的事？"],
      ["短暂晴天","开心泡泡","快乐不必很大，一秒也可以被收藏。","#fff4be","#f0b92e","今天最像晴天的 1 分钟在哪里？"],["留白日","空空的","不是坏，只是暂时没那么多颜色。","#e8eef6","#88a4bd","你想把哪一段空白留给谁或什么？"],["心事有点重","难过","今天可能有点沉，但它仍然值得被写下。","#efe7ff","#8a75d6","最重的那部分，名字叫什么？"],["慢慢好转","释然","一点点松开，也是一种前进。","#dff2e7","#58a675","是什么让今天比昨天更好一点？"],["仍然认真","疲惫","累也没有抹掉你的认真。","#e4f0ff","#6e9ed8","即使不轻松，你今天还是做了什么？"],["温柔收尾","满足","今天也有可以收进口袋的小确幸。","#ffe8dd","#df8b6c","今天最后一个想保留的画面是什么？"],
      ["安安静静的好","平静","不吵闹，也可以很珍贵。","#dff2e7","#5aa879","今天有没有一个不吵闹却很珍贵的瞬间？"],["想被理解","委屈","不是大风暴，但心里有一点酸。","#ffe1eb","#e66f98","如果有人完全理解你，你最想被理解哪一点？"],["整理情绪","好奇","把感受排一排，看它们各自想说什么。","#efe7ff","#9b7be8","哪些感受需要排队，哪些可以先放下？"],["回到自己","安稳","像慢慢回到自己的房间。","#ffe8dd","#d98b68","今天有没有一刻，你突然像回到了自己？"],["正在路上","期待","你还在往前走，哪怕很慢。","#e4f0ff","#5d9ce3","你现在最想往哪个方向再走一步？"],["温柔结尾","温柔","30 天结束前，给自己一个轻轻的拥抱。","#dff2e7","#5aa879","30 天结束前，你想对自己说什么？"]
    ];
    const moodPool=days.map(d=>({name:d[1],desc:d[2],bg:d[3],dot:d[4]}));
    const textFields=[["events","今天发生了什么","写下三件真实发生的事。可以很小。","big"],["mood","情绪从哪里来","这个情绪可能和哪件事、哪句话、哪个念头有关？",""],["body","身体在说什么","肩膀、胸口、胃、头、呼吸，哪里最明显？",""],["need","我真正需要","休息、陪伴、边界、确认感、安静、行动……",""],["kind","对自己说一句","像对好朋友那样，对今天的自己说话。",""],["tomorrow","明天的小动作","一件不会吓到自己的小事。",""]];
    const checks=["喝水","认真吃饭","晒太阳或看天空","走动 5 分钟","整理桌面一小角","少刷 10 分钟手机","说出一个真实需要","拒绝一件不想做的事","感谢自己一件事","早点睡一点","深呼吸 6 次","给明天留空白"];
    const $=(id)=>document.getElementById(id);let day=Number(localStorage.getItem("diary-current-day")||1);
    function k(name){return`diary-day-${day}-${name}`}function save(name,value){localStorage.setItem(k(name),value);$("saveState").textContent="已自动保存"}function load(name){return localStorage.getItem(k(name))||""}
    function cardForCurrentDay(){const saved=localStorage.getItem(k("card"));if(saved){try{return JSON.parse(saved)}catch(e){}}const d=days[day-1];return{name:d[1],desc:d[2],bg:d[3],dot:d[4]}}
    function setCard(card){localStorage.setItem(k("card"),JSON.stringify(card));render();turnMobile("card")}
    function randomCard(){setCard(moodPool[Math.floor(Math.random()*moodPool.length)]);$("saveState").textContent="已随机换一张情绪卡"}
    function renderMoodOptions(){$("moodOptions").innerHTML=moodPool.map((m,i)=>`<button class="mood-option" type="button" data-mood="${i}" style="--c:${m.bg}"><strong>${m.name}</strong><span>${m.desc}</span></button>`).join("");document.querySelectorAll(".mood-option").forEach(btn=>btn.addEventListener("click",()=>{setCard(moodPool[Number(btn.dataset.mood)]);$("moodChooser").classList.remove("open");$("saveState").textContent="已选择情绪卡"}))}
    function turnMobile(mode){const book=$("book");book.classList.remove("show-card","show-write","turning");book.classList.add(mode==="write"?"show-write":"show-card","turning");setTimeout(()=>book.classList.remove("turning"),360)}
    function renderSelect(){$("daySelect").innerHTML=days.map((d,i)=>`<option value="${i+1}">第 ${String(i+1).padStart(2,"0")} 天 · ${d[0]}</option>`).join("")}
    function renderFields(){const parts=[];parts.push('<div class="grid">');textFields.forEach((f,i)=>{if(i===2)parts.push('</div><div class="grid">');if(i===4)parts.push('</div><div class="grid">');parts.push(`<div class="field"><label for="${f[0]}">${f[1]}</label><textarea id="${f[0]}" class="${f[3]}" placeholder="${f[2]}"></textarea></div>`)});parts.push('</div>');parts.push('<div class="checks"><div class="check-title" style="grid-column:1/-1">今天可以勾选的小照顾</div>');checks.forEach((c,i)=>parts.push(`<label class="check"><input type="checkbox" id="check-${i}"><span>${c}</span></label>`));parts.push('</div>');$("fields").innerHTML=parts.join("");textFields.forEach(f=>{const el=$(f[0]);el.value=load(f[0]);el.addEventListener("input",()=>save(f[0],el.value))});checks.forEach((_,i)=>{const el=$(`check-${i}`);el.checked=load(`check-${i}`)==="1";el.addEventListener("change",()=>save(`check-${i}`,el.checked?"1":"0"))})}
    function render(){day=Math.max(1,Math.min(30,day));localStorage.setItem("diary-current-day",String(day));const d=days[day-1],card=cardForCurrentDay();document.documentElement.style.setProperty("--progress",`${day/30*100}%`);$("emotionPicture").style.setProperty("--mood",card.bg);$("swatch").style.setProperty("--dot",card.dot);$("posterDay").textContent=`DAY ${String(day).padStart(2,"0")}`;$("emotionName").textContent=card.name;$("emotionDesc").textContent=card.desc;$("formDay").textContent=`第 ${String(day).padStart(2,"0")} 天 · ${d[0]}`;$("formTitle").textContent="今天这样记录";$("formPrompt").textContent=d[5];$("leftPageNo").textContent=`${day*2-1}`;$("rightPageNo").textContent=`${day*2}`;$("daySelect").value=String(day);$("book").animate([{transform:"rotateY(-1deg)"},{transform:"rotateY(0)"}],{duration:260,easing:"ease-out"});renderFields()}
    function collect(){const data={day,values:{}};for(let d=1;d<=30;d++){textFields.forEach(f=>data.values[`diary-day-${d}-${f[0]}`]=localStorage.getItem(`diary-day-${d}-${f[0]}`)||"");checks.forEach((_,i)=>data.values[`diary-day-${d}-check-${i}`]=localStorage.getItem(`diary-day-${d}-check-${i}`)||"");data.values[`diary-day-${d}-card`]=localStorage.getItem(`diary-day-${d}-card`)||""}return data}
    function applyData(data){if(!data||!data.values)return;Object.keys(data.values).forEach(key=>localStorage.setItem(key,data.values[key]));day=Number(data.day||1);render()}function encode(data){return btoa(unescape(encodeURIComponent(JSON.stringify(data))))}function decode(code){return JSON.parse(decodeURIComponent(escape(atob(code))))}
    $("prevBtn").addEventListener("click",()=>{day--;render();turnMobile("card")});$("nextBtn").addEventListener("click",()=>{day++;render();turnMobile("card")});$("daySelect").addEventListener("change",(e)=>{day=Number(e.target.value);render();turnMobile("card")});$("syncToggle").addEventListener("click",()=>$("syncPanel").classList.toggle("open"));$("chooseMood").addEventListener("click",()=>{const panel=$("moodChooser");panel.classList.toggle("open");$("syncPanel").classList.remove("open");if(panel.classList.contains("open"))panel.scrollIntoView({behavior:"smooth",block:"start"})});$("emotionPicture").addEventListener("click",randomCard);$("showCard").addEventListener("click",()=>turnMobile("card"));$("showWrite").addEventListener("click",()=>turnMobile("write"));
    $("makeCode").addEventListener("click",async()=>{const code=encode(collect());$("syncCode").value=code;try{await navigator.clipboard.writeText(code);$("saveState").textContent="同步码已复制"}catch(e){}});
    $("readCode").addEventListener("click",()=>{try{applyData(decode($("syncCode").value.trim()));$("saveState").textContent="同步码已读取"}catch(e){alert("同步码无法读取，请确认是否复制完整。")}});
    $("exportJson").addEventListener("click",()=>{const blob=new Blob([JSON.stringify(collect(),null,2)],{type:"application/json;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="emotion-diary-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)});
    $("importJson").addEventListener("click",()=>$("fileInput").click());$("fileInput").addEventListener("change",async(e)=>{const file=e.target.files[0];if(!file)return;try{applyData(JSON.parse(await file.text()));$("saveState").textContent="备份已导入"}catch(err){alert("备份文件无法读取。")}});
    renderSelect();renderMoodOptions();render();
  </script>
</body>
</html>
